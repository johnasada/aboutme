<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Asada — Home</title>
  <style>
    :root {
      --bg: #F2E9D8;
      --ink: #33202F;
      --ink-soft: #5A4756;
      --sage: #7A9471;
      --ochre: #D9A441;
      --card: #FBF6EC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
      line-height: 1.6;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-size: 42px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      color: var(--ink-soft);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .links a {
      display: inline-block;
      text-decoration: none;
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome to John Asada’s Portfolio</h1>
    <p>This is the homepage for your GitHub Pages site. Use it as the landing page for your about section and portfolio work.</p>
    <div class="links">
      <a href="john-asada-about-me.html">About Me</a>
      <a href="aboutme.html">Portfolio</a>
      <a href="photography.html">Photography</a>
    </div>
  </div>
</body>
</html>
